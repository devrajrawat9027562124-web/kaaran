name: Deploy to GitHub Pages

# Publishes the frontend (Python runs fully in the browser).
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "tracer/**"
      - "tests/programs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Where the deployed backend is (accounts, C/C++): a repository variable,
      # Settings -> Secrets and variables -> Actions -> Variables -> KAARAN_BACKEND_URL.
      # Unset, the site looks for a backend on the visitor's own computer.
      - run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.KAARAN_BACKEND_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
