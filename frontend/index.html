<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Step through your program and ask why a variable has its value." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"
    />
    <title>Kaaran</title>
    <script>
      // The chosen colour theme, applied before the page draws (src/theme.ts keeps it after)
      try {
        var theme = localStorage.getItem('kaaran.theme')
        if (['paper', 'sepia', 'blackboard', 'night', 'contrast'].indexOf(theme) < 0) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'blackboard' : 'paper'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {
        // storage blocked: index.css follows the computer's light or dark setting
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
